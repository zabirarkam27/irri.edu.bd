name: Production smoke checks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || vars.PRODUCTION_SMOKE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SMOKE_FRONTEND_ORIGIN: ${{ vars.SMOKE_FRONTEND_ORIGIN }}
      SMOKE_BACKEND_ORIGIN: ${{ vars.SMOKE_BACKEND_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/production-smoke.mjs
